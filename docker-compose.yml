name: vedu-lms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - vedu_postgres_data:/var/lib/postgresql/data
      - ./database/vedu/vedu_v6.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/vedu/demo_seed.sql:/docker-entrypoint-initdb.d/02-demo-seed.sql:ro
      - ./database/vedu/portal_demo_seed.sql:/docker-entrypoint-initdb.d/03-portal-demo-seed.sql:ro
      - ./database/vedu/platform_upgrade.sql:/docker-entrypoint-initdb.d/04-platform-upgrade.sql:ro
      - ./database/vedu/content_workflow.sql:/docker-entrypoint-initdb.d/05-content-workflow.sql:ro
      - ./database/vedu/01_essay_migration.sql:/docker-entrypoint-initdb.d/06-final-essay.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vedu_private

  demo-seed:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
    command:
      - sh
      - -ec
      - |
        until psql -Atqc "SELECT to_regclass('assessment.final_essay_submissions')" 2>/dev/null | grep -q final_essay_submissions; do
          echo "Waiting for PostgreSQL initialization to finish..."
          sleep 2
        done
        psql -v ON_ERROR_STOP=1 \
          -f /seed/portal_demo_seed.sql \
          -f /seed/platform_upgrade.sql \
          -f /seed/content_workflow.sql \
          -f /seed/curated_catalog.sql \
          -f /seed/01_essay_migration.sql \
