services:
  vedu-backend:
    build:
      context: .
      dockerfile: dockerfile

    container_name: vedu-backend

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production

    extra_hosts:
      - "host.docker.internal:host-gateway"
