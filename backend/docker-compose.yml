services:
  vedu-backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vedu-backend

    ports:
      - "3000:3000"

    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      DB_DATABASE: vedu_v4
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production

    extra_hosts:
      - "host.docker.internal:host-gateway"